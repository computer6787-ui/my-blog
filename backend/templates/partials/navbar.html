<header class="header">

    <div class="logo">
        <img src="{{ url_for('static', path='images/logo_in.png') }}" alt="Logo">
        <section class="logo_text">
        <h1>Lumora</h1>
        <p>Where ideas come to light</p>
        </section>
    </div>

    <nav class="nav">
            <a class="nav_button" href="/">Home</a>
            <button id="dark-mode-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
            <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
            </button>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<aside class="drawer" id="drawer">
    <h2>Menu</h2>
    <hr>

    <a href="/user">Profile</a>
    <a href="/user">My Blogs</a>
    <a href="/game" id="play-game-link">Play Game</a>
    <a id="auth-link" href="/login">Login</a>
</aside>

<div class="lumora-modal-backdrop" id="gameConfirmBackdrop">
    <div class="lumora-modal">
        <div class="lumora-modal-header">
            <div class="lumora-modal-badge">?</div>
            <h3>Start Game</h3>
        </div>
        <p>You are about to leave this page and start playing NOIR HORDE. Any unsaved changes on the current page may be lost.</p>
        <div class="lumora-modal-actions">
            <button class="lumora-btn lumora-btn-secondary" id="gameCancelBtn">Cancel</button>
            <button class="lumora-btn lumora-btn-primary" id="gameConfirmBtn">Play Now</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const playLinks = document.querySelectorAll('#play-game-link');
        const backdrop = document.getElementById('gameConfirmBackdrop');
        const confirmBtn = document.getElementById('gameConfirmBtn');
        const cancelBtn = document.getElementById('gameCancelBtn');
        if (!backdrop || !confirmBtn || !cancelBtn || playLinks.length === 0) return;

        let pendingHref = null;

        function openConfirm(href) {
            pendingHref = href;
            backdrop.classList.add('show');
            backdrop.classList.remove('hide');
        }

        function closeConfirm() {
            backdrop.classList.remove('show');
            backdrop.classList.add('hide');
            pendingHref = null;
        }

        playLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                openConfirm(link.getAttribute('href'));
            });
        });

        confirmBtn.addEventListener('click', () => {
            const href = pendingHref;
            closeConfirm();
            if (href) {
                window.location.href = href;
            }
        });

        cancelBtn.addEventListener('click', closeConfirm);

        backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) closeConfirm();
        });
    })();
</script>

<script>
    function toggleMenu() {
        const drawer = document.getElementById('drawer');
        const overlay = document.querySelector('.overlay');
        const menuBtn = document.getElementById('menu-btn');

        if (!drawer || !overlay || !menuBtn) return;

        const isOpen = !drawer.classList.contains('open');
        drawer.classList.toggle('open', isOpen);
        menuBtn.classList.toggle('open', isOpen);
        overlay.classList.toggle('visible', isOpen);
    }

    function closeMenu() {
        const drawer = document.getElementById('drawer');
        const overlay = document.querySelector('.overlay');
        const menuBtn = document.getElementById('menu-btn');

        if (!drawer || !overlay || !menuBtn) return;

        drawer.classList.remove('open');
        menuBtn.classList.remove('open');
        overlay.classList.remove('visible');
    }

    (function() {
        const btn = document.getElementById('dark-mode-toggle');
        if (btn) {
            function applyTheme(isDark) {
                document.body.classList.toggle('dark-mode', isDark);
                btn.textContent = isDark ? '☀️' : '🌙';
                try {
                    localStorage.setItem('lumora-theme', isDark ? 'dark' : 'light');
                } catch (error) {
                    // no-op if storage is unavailable
                }
            }

            const savedTheme = (() => {
                try {
                    return localStorage.getItem('lumora-theme');
                } catch (error) {
                    return null;
                }
            })();

            applyTheme(savedTheme === 'dark'); 

            btn.addEventListener('click', function() {
                applyTheme(!document.body.classList.contains('dark-mode'));
            });
        }
    })();
</script>
