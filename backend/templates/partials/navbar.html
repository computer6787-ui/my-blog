<header class="header">

    <div class="logo">
        <a href="/" ><img src="{{ url_for('static', path='images/logo_in.png') }}" alt="Logo"></a>
        <section class="logo_text">
        <h1>Lumora</h1>
        <p>Where ideas come to light</p>
        </section>
        <a class="nav_button mobile-home" href="/">Home</a>
    </div>

    <nav class="nav">
            <a class="nav_button" href="/">Home</a>
            <button id="nav-chat-btn" class="notif-bell" type="button" aria-label="Direct Messages" onclick="window.dispatchEvent(new CustomEvent('lumora:toggle-direct-chat'))" title="Direct Messages">
                <span class="bell-icon">💬</span>
                <span id="nav-chat-badge" class="notif-badge lumora-chat-unread-badge hidden">0</span>
            </button>
            <button id="notif-bell" class="notif-bell" type="button" aria-label="Notifications">
                <span class="bell-icon">🔔</span>
                <span id="notif-badge" class="notif-badge hidden">0</span>
            </button>
            <a id="nav-avatar" class="nav-avatar hidden" href="/user" aria-label="Profile">
                <span id="nav-avatar-initial" class="nav-avatar-initial">U</span>
                <img id="nav-avatar-img" class="nav-avatar-img hidden" alt="Profile picture" />
            </a>
            <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
            </button>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<!-- Notifications Drawer -->
<aside class="notif-drawer" id="notif-drawer">
    <div class="notif-drawer-header">
        <h2>Notifications</h2>
        <button type="button" id="notif-close" class="notif-close" aria-label="Close notifications">×</button>
    </div>
    <hr>
    <div id="notif-list" class="notif-list">
        <!-- Notifications loaded here -->
    </div>
</aside>

<aside class="drawer" id="drawer">
    <h2>Menu</h2>
    <hr>

    <a href="/user">Profile</a>
    <a href="/my-blogs">My Blogs</a>
    <a href="#" onclick="window.dispatchEvent(new CustomEvent('lumora:toggle-direct-chat')); closeMenu(); return false;">Direct Messages <span class="lumora-chat-unread-badge hidden" style="background:#6366f1;color:white;padding:2px 7px;border-radius:9999px;font-size:11px;margin-left:6px;font-weight:bold;">0</span></a>
    <a href="#" onclick="window.dispatchEvent(new CustomEvent('lumora:toggle-global-chat')); closeMenu(); return false;">Global Live Room</a>
    <a href="/admin" id="admin-panel-link" class="hidden">🔧 Admin Panel</a>
    <a href="#" id="drawer-notif-link">Notifications</a>

    <button type="button" id="drawer-theme-toggle" class="drawer-theme-toggle" aria-label="Toggle dark mode">
        <span class="drawer-theme-icon" id="drawer-theme-icon">🌙</span>
        <span class="drawer-theme-label" id="drawer-theme-label">Light mode</span>
        <span class="drawer-theme-switch" aria-hidden="true">
            <span class="drawer-theme-knob"></span>
        </span>
    </button>

    <!-- Auth toggle is placed at the very bottom of the menu -->
    <a id="auth-link" href="/login">Login</a>
</aside>

<script>
    function toggleMenu() {
        const drawer = document.getElementById('drawer');
        const overlay = document.querySelector('.overlay');
        const menuBtn = document.getElementById('menu-btn');

        if (!drawer || !overlay || !menuBtn) return;

        const isOpen = !drawer.classList.contains('open');
        drawer.classList.toggle('open', isOpen);
        menuBtn.classList.toggle('open', isOpen);
        overlay.classList.toggle('visible', isOpen);
    }

    function closeMenu() {
        const drawer = document.getElementById('drawer');
        const overlay = document.querySelector('.overlay');
        const menuBtn = document.getElementById('menu-btn');

        if (!drawer || !overlay || !menuBtn) return;

        drawer.classList.remove('open');
        menuBtn.classList.remove('open');
        overlay.classList.remove('visible');
    }

    (function() {
        const toggleBtn = document.getElementById('drawer-theme-toggle');
        if (toggleBtn) {
            function applyTheme(isDark) {
                document.body.classList.toggle('dark-mode', isDark);
                const label = document.getElementById('drawer-theme-label');
                const icon = document.getElementById('drawer-theme-icon');
                if (label) label.textContent = isDark ? 'Dark mode' : 'Light mode';
                if (icon) icon.textContent = isDark ? '☀️' : '🌙';
                try { localStorage.setItem('lumora-theme', isDark ? 'dark' : 'light'); } catch (e) {}
            }
            const savedTheme = (() => { try { return localStorage.getItem('lumora-theme'); } catch (e) { return null; } })();
            applyTheme(savedTheme === 'dark');
            toggleBtn.addEventListener('click', function() {
                applyTheme(!document.body.classList.contains('dark-mode'));
            });
        }
    })();

    (function() {
        const avatar = document.getElementById('nav-avatar');
        if (!avatar) return;
        let token = null;
        try { token = localStorage.getItem('token'); } catch (e) { token = null; }
        if (!token) return;
        const initialEl = document.getElementById('nav-avatar-initial');
        const imgEl = document.getElementById('nav-avatar-img');
        avatar.addEventListener('click', function(event) {
            const drawer = document.getElementById('drawer');
            const menuBtn = document.getElementById('menu-btn');
            const overlay = document.querySelector('.overlay');
            if (drawer) drawer.classList.remove('open');
            if (menuBtn) menuBtn.classList.remove('open');
            if (overlay) overlay.classList.remove('visible');
        });
        // Use relative URLs — same origin as the page, avoids CORS when loaded via 127.0.0.1 vs localhost
        fetch('/user/me', { headers: { Authorization: 'Bearer ' + token }, credentials: 'include' })
            .then((response) => (response.ok ? response.json() : Promise.reject(new Error('Unauthorized'))))
            .then((user) => {
                const picture = user && user.profile_picture_url ? user.profile_picture_url : '';
                const name = (user && user.name) || '';
                avatar.title = name || 'Profile';
                if (imgEl && picture) {
                    if (initialEl) initialEl.textContent = (name[0] || 'U').toUpperCase();
                    imgEl.onerror = function() { imgEl.classList.add('hidden'); if (initialEl) initialEl.classList.remove('hidden'); };
                    imgEl.src = picture;
                    imgEl.classList.remove('hidden');
                    if (initialEl) initialEl.classList.add('hidden');
                } else if (initialEl) {
                    initialEl.textContent = (name[0] || 'U').toUpperCase();
                    if (imgEl) imgEl.classList.add('hidden');
                    initialEl.classList.remove('hidden');
                }
                avatar.classList.remove('hidden');
                if (user && (user.role === 'admin' || user.role === 'moderator')) {
                    var adminLink = document.getElementById('admin-panel-link');
                    if (adminLink) adminLink.classList.remove('hidden');
                }
            })
            .catch(function() {});
    })();
</script>
