{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

 <main>
    <article class="user-profile">
        <div class="profile-header">
            <h3>User Profile</h3>
            <div id="profile-loading" class="profile-loading hidden" aria-live="polite">
                <div class="loading-spinner small"></div>
                <span>Loading profile...</span>
            </div>
        </div>

        <div class="profile-details">
            <h5 class="profile-name-row">
                <span class="profile-label">Name:</span>
                <span id="name" class="name"></span>
                <input id="name-input" type="text" name="name" class="hidden inline-name-input" placeholder="New name" maxlength="50" required>
                <button type="button" class="text-button" id="toggle-name-edit" aria-label="Edit name">✎</button>
            </h5>
            <h5>
                <span class="profile-label">Email:</span>
                <span id="email" class="email"></span>
            </h5>
        </div>

        <p id="name-message" class="form-message" aria-live="polite"></p>
    </article>
    <article id="published-blogs">
        <hr>
        <h4>Blogs:<span></span></h4>
        <br>
        <br>
        <hr> 
    </article>
 </main>
<script type="module" src="{{ url_for('static', path='js/user.js') }}?v=20260818"></script>
<script type="module" src="{{ url_for('static', path='js/index.js') }}?v=20260818"></script>


{% endblock %}

{% block scripts %}
{% endblock %}
