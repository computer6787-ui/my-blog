{% extends "base.html" %}

{% block title %}My Blogs - Lumora{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<main class="profile-main">
    <section class="user-stories-section my-blogs-page">
        <div class="user-stories-header">
            <div class="user-stories-title-wrap">
                <h3>My Published Stories</h3>
                <span id="story-count-badge" class="badge-count">0 stories</span>
            </div>
            <div class="profile-card-actions compact-actions">
                <a href="/create-blog" class="hero-btn hero-btn-primary">
                    <span>Write New Story</span>
                    <span class="btn-icon">✍️</span>
                </a>
            </div>
        </div>

        <div id="published-blogs" class="user-stories-grid" aria-live="polite">
            <!-- User story cards loaded here -->
        </div>
        <div id="load-more-wrap" class="load-more-wrap" style="display: none; text-align: center; margin-top: 1.5rem;">
            <button type="button" id="btn-load-more" class="hero-btn hero-btn-primary" style="min-width: 180px;">Load More</button>
        </div>
    </section>
</main>

<script type="module" src="{{ url_for('static', path='js/my_blogs.js') }}?v=20260913"></script>
<script type="module" src="{{ url_for('static', path='js/index.js') }}?v=20260913"></script>
{% endblock %}
