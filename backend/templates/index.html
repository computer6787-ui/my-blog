{% extends "base.html" %}

{% block title %}Lumora - Where Ideas Come to Light{% endblock %}

{% block extra_head %}
<link rel="preload" as="image" href="/static/images/sakura/hero-scene-bg.webp" fetchpriority="high">
{% endblock %}

{% block content %}
<meta name="strix-verification" content="strix-verify-611e2ba7faf4e44731389461034ab075">
<div id="sakura-poster-root"></div>

<div class="hero-cta-strip">
    <a href="#explore-section" id="read_blogs" class="hero-btn hero-btn-primary">
        Explore Stories
        <span class="btn-icon">↓</span>
    </a>
    <a href="/create-blog" id="write_blog" class="hero-btn hero-btn-secondary">
        Write a Story
        <span class="btn-icon">✍️</span>
    </a>
</div>

<section id="explore-section" class="explore-section">
    <div class="section-header">
        <div class="section-title-wrap">
            <span class="section-subtitle">DISCOVER &amp; READ</span>
            <h2 class="section-title">Latest Stories</h2>
        </div>

        <div class="search-wrap">
            <div class="search-controls">
                <div class="Search_container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search_bar" placeholder="Search by title or content..." autocomplete="off">
                    <button type="button" id="clear_search" class="clear-search-btn hidden" aria-label="Clear search">✕</button>
                    <button id="search_button" class="search-action-btn">Search</button>
                </div>
                <div class="category-filter-shell" id="category_filter_shell">
                    <label class="category-filter-label">Category</label>
                    <div class="category-filter-wrap">
                        <span class="category-filter-icon">✦</span>
                        <button type="button" id="category_filter_button" class="category-filter-button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="category-filter-value">All categories</span>
                            <span class="category-filter-chevron">▾</span>
                        </button>
                        <input type="hidden" id="category_filter" value="">
                    </div>

                    <div id="category_filter_menu" class="category-filter-menu" role="listbox" aria-label="Filter by category">
                        <button type="button" class="category-option is-selected" data-value="" role="option" aria-selected="true">All categories</button>
                        <button type="button" class="category-option" data-value="Tech" role="option" aria-selected="false">Tech</button>
                        <button type="button" class="category-option" data-value="Life" role="option" aria-selected="false">Life</button>
                        <button type="button" class="category-option" data-value="Creative" role="option" aria-selected="false">Creative</button>
                        <button type="button" class="category-option" data-value="Ideas" role="option" aria-selected="false">Ideas</button>
                        <button type="button" class="category-option" data-value="Insights" role="option" aria-selected="false">Insights</button>
                        <button type="button" class="category-option" data-value="Thoughts" role="option" aria-selected="false">Thoughts</button>
                        <button type="button" class="category-option" data-value="Design" role="option" aria-selected="false">Design</button>
                        <button type="button" class="category-option" data-value="Story" role="option" aria-selected="false">Story</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blog_section" class="blog-grid" aria-live="polite">
        <!-- Blog cards loaded dynamically -->
    </div>

    <nav id="blog_pagination" class="blog-pagination" aria-label="Blog navigation"></nav>
</section>

<script type="module" src="{{ url_for('static', path='js/blog.js') }}?v=20260905b"></script>
<script type="module" src="{{ url_for('static', path='js/index.js') }}?v=20260901"></script>
<script type="module" src="{{ url_for('static', path='js/home.js') }}?v=20260901"></script>

{% endblock %}

{% block scripts %}
{% endblock %}
