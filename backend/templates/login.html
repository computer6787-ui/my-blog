{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block extra_head %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
{% endblock %}

{% block content %}
    <main>
        <div class="auth-container">
            <form id="login_form" method="post">
            <h2>Login</h2>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="button" id="togglePassword" class="password-toggle">🙈</button>
            </div>
            <button type="submit" id="login_button">Login</button>
            </form>

            <div class="auth-divider">
                <span class="auth-divider-line"></span>
                <span class="auth-divider-text">or</span>
                <span class="auth-divider-line"></span>
            </div>

            <div id="google_signin_button" class="google-btn-wrapper"></div>

            <div class="auth-links">
            <p>Don't have an account? <a href="/register">Register here</a></p>
            <p>Forgot your password? <a href="/resetPass">Reset here</a></p>
        </div>
        </div>
    </main>
<script type="module" src="{{ url_for('static', path='js/login.js') }}"></script>
{% endblock %}


{% block scripts %}
{% endblock %}
