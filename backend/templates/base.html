<!DOCTYPE html>
<html lang="en">

<head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon/favicon-96x96.png') }}" sizes="96x96" />

        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon/favicon.svg') }}" />

        <link rel="shortcut icon" href="{{ url_for('static', path='images/favicon/favicon.ico') }}" />

        <link rel="apple-touch-icon" sizes="180x180"
            href="{{ url_for('static', path='images/favicon/apple-touch-icon.png') }}" />

        <meta name="apple-mobile-web-app-title" content="Lumora" />

        <link rel="manifest"
            href="{{ url_for('static', path='images/favicon/site.webmanifest') }}" />

    <title>{% block title %}Lumora{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>

<body>

    <header>
        {% include "partials/navbar.html" %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        {% include "partials/footer.html" %}
    </footer>

    {% block scripts %}
    {% endblock %}

</body>

</html>
