<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon/favicon-96x96.png') }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon/favicon.svg') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', path='images/favicon/favicon.ico') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='images/favicon/apple-touch-icon.png') }}" />
    <meta name="apple-mobile-web-app-title" content="Lumora" />
    <link rel="manifest" href="{{ url_for('static', path='images/favicon/site.webmanifest') }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" onload="this.rel='stylesheet'; this.onload=null;">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"></noscript>

    <title>{% block title %}Lumora{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Lumora is a modern blog and thought space where ideas spark and stories unfold. Read freely, write boldly, and discover unique perspectives.{% endblock %}">
    <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
    <link rel="canonical" href="{% block canonical %}https://lumorablogs.top{{ request.url.path }}{% endblock %}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://lumorablogs.top{{ request.url.path }}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Lumora - Where Ideas Come to Light{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A modern blog and thought space where ideas spark and stories unfold.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://lumorablogs.top/static/images/favicon/apple-touch-icon.png{% endblock %}">
    <meta property="og:site_name" content="Lumora">

    <!-- Twitter -->
    <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
    <meta name="twitter:title" content="{% block twitter_title %}Lumora - Where Ideas Come to Light{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}A modern blog and thought space where ideas spark and stories unfold.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://lumorablogs.top/static/images/favicon/apple-touch-icon.png{% endblock %}">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Lumora",
        "url": "https://lumorablogs.top/",
        "description": "A modern blog and thought space where ideas spark and stories unfold.",
        "potentialAction": {
            "@type": "SearchAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://lumorablogs.top/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lumora",
        "url": "https://lumorablogs.top",
        "logo": {
            "@type": "ImageObject",
            "url": "https://lumorablogs.top/static/images/favicon/apple-touch-icon.png"
        }
    }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', path='css/variables.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/nav.css') }}?v=20260912">
    <link rel="stylesheet" href="{{ url_for('static', path='css/hero.css') }}?v=20260905">
    <link rel="stylesheet" href="{{ url_for('static', path='css/explore.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/blog.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/single-blog.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/editor.css') }}?v=20260912">
    <link rel="stylesheet" href="{{ url_for('static', path='css/profile.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/footer.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='css/responsive.css') }}?v=20260902">
    <link rel="stylesheet" href="{{ url_for('static', path='chat/chat-bundle.css') }}?v=20260907b">

    {% block extra_head %}{% endblock %}
</head>

<body>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('lumora-theme');
                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                }
            } catch (error) {
                // no-op for restricted environments
            }
        })();
    </script>

    {% include "partials/navbar.html" %}

    <script>
        // Single source of truth for the navbar height. Measures the real header
        // (handles the mobile 2-row wrap and any responsive height change) and
        // exposes it as --navbar-height so content below never needs hardcoded
        // pt/mt offsets.
        (function () {
            var root = document.documentElement;
            var header = document.querySelector('.header');
            if (!header) return;
            function update() {
                root.style.setProperty('--navbar-height', header.offsetHeight + 'px');
            }
            update();
            if (window.ResizeObserver) {
                new ResizeObserver(update).observe(header);
            }
            window.addEventListener('resize', update);
        })();
    </script>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div id="global-loader" class="global-loader hidden" aria-live="polite" aria-busy="true">
        <div class="global-loader-spinner"></div>
        <span id="global-loader-text">Loading...</span>
    </div>

    {% if request and request.url.path == '/' %}
    <footer>
        {% include "partials/footer.html" %}
    </footer>
    {% else %}
    <footer class="page-footer">
        <p>© 2026 Lumora. All rights reserved.</p>
    </footer>
    {% endif %}

    {% block scripts %}
    {% endblock %}

    <script src="{{ url_for('static', path='js/notifications.js') }}?v=20260906"></script>
    <script type="module" src="{{ url_for('static', path='chat/chat-bundle.js') }}?v=20260907b"></script>

</body>

</html>
