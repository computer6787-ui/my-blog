<body>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('lumora-theme');
                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                }
            } catch (error) {
                // no-op for restricted environments
            }
        })();
    </script>

    {% include "partials/navbar.html" %}

    <script>
        // Single source of truth for the navbar height. Measures the real header
        // (handles the mobile 2-row wrap and any responsive height change) and
        // exposes it as --navbar-height so content below never needs hardcoded
        // pt/mt offsets.
        (function () {
            var root = document.documentElement;
            var header = document.querySelector('.header');
            if (!header) return;
            function update() {
                root.style.setProperty('--navbar-height', header.offsetHeight + 'px');
            }
            update();
            if (window.ResizeObserver) {
                new ResizeObserver(update).observe(header);
            }
            window.addEventListener('resize', update);
        })();
    </script>

    <script>
    // Smooth lazy-section reveal + image lazy-load on every page
    (function() {
        function loadImg(img) {
            if (!img.dataset.src) return;
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
        }

        // Observe lazy sections: reveal + load any images inside
        var sections = document.querySelectorAll('.lazy-section');
        if (sections.length && 'IntersectionObserver' in window) {
            var secObs = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        var el = entry.target;
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                        el.querySelectorAll('img.lazy-bg[data-src]').forEach(loadImg);
                        secObs.unobserve(el);
                    }
                });
            }, { rootMargin: '200px' });
            sections.forEach(function(s) { secObs.observe(s); });
        } else {
            sections.forEach(function(s) {
                s.style.opacity = '1';
                s.style.transform = 'translateY(0)';
                s.querySelectorAll('img.lazy-bg[data-src]').forEach(loadImg);
            });
        }

        // Also observe standalone lazy images (not inside a .lazy-section)
        var standaloneImgs = [];
        document.querySelectorAll('img.lazy-bg[data-src]').forEach(function(img) {
            if (!img.closest('.lazy-section')) standaloneImgs.push(img);
        });
        if (standaloneImgs.length && 'IntersectionObserver' in window) {
            var imgObs = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        loadImg(entry.target);
                        imgObs.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '300px' });
            standaloneImgs.forEach(function(img) { imgObs.observe(img); });
        } else {
            standaloneImgs.forEach(loadImg);
        }
    })();
    </script>
