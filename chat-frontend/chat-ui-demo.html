<title>Lumora Chat UI</title>
<style>
  :root {
    --color-bg: #0f172a;
    --color-surface: #161213;
    --color-card: #222735;
    --color-text: #f8fafc;
    --color-text-muted: #94a3b8;
    --color-primary: #a2526b;
    --color-primary-light: #c26d84;
    --color-border: #334155;
    --color-success: #22c55e;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --color-bg: #fdf8f9;
      --color-surface: #ffffff;
      --color-card: #f5f5f5;
      --color-text: #1a1617;
      --color-text-muted: #7a6b6d;
      --color-border: #e5e7eb;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow: hidden;
  }

  .chat-container {
    display: flex;
    height: 100vh;
    flex-direction: column;
  }

  /* ===== Header ===== */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a2526b, #c26d84);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    color: white;
  }

  .header-info h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 2px;
  }

  .header-info p {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .online-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-success);
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .header-actions {
    display: flex;
    gap: 0.5rem;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--color-text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-size: 18px;
  }

  .icon-btn:hover {
    background: rgba(162, 82, 107, 0.1);
    color: var(--color-primary-light);
  }

  /* ===== Messages Area ===== */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  .messages-area::-webkit-scrollbar {
    width: 6px;
  }

  .messages-area::-webkit-scrollbar-track {
    background: transparent;
  }

  .messages-area::-webkit-scrollbar-thumb {
    background: var(--color-primary);
    border-radius: 3px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  .empty-state h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .empty-state p {
    font-size: 13px;
    color: var(--color-text-muted);
    max-width: 200px;
  }

  /* ===== Messages ===== */
  .message-group {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(12px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .message-group.own {
    flex-direction: row-reverse;
    justify-content: flex-end;
  }

  .message-bubble {
    max-width: 70%;
    padding: 0.75rem 1rem;
    border-radius: 18px;
    word-wrap: break-word;
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.4;
    font-size: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    transition: all 0.2s ease;
  }

  .message-bubble.own {
    background: var(--color-primary);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .message-bubble.other {
    background: var(--color-card);
    color: var(--color-text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--color-border);
  }

  .message-time {
    font-size: 11px;
    color: var(--color-text-muted);
    margin-top: 4px;
    padding: 0 0.5rem;
    min-width: 40px;
    text-align: right;
  }

  .message-bubble.other + .message-time {
    text-align: left;
  }

  /* ===== Input Area ===== */
  .input-area {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--color-border);
    background: var(--color-surface);
    flex-shrink: 0;
  }

  .input-wrapper {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
  }

  .input-actions {
    display: flex;
    gap: 0.5rem;
  }

  .input-field {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background: rgba(162, 82, 107, 0.05);
    color: var(--color-text);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s ease;
    resize: none;
    max-height: 100px;
  }

  .input-field:focus {
    outline: none;
    border-color: var(--color-primary-light);
    box-shadow: 0 0 0 2px rgba(162, 82, 107, 0.1);
  }

  .input-field::placeholder {
    color: var(--color-text-muted);
  }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--color-primary);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .send-btn:hover:not(:disabled) {
    background: var(--color-primary-light);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .send-btn.sending {
    animation: sendPulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes sendPulse {
    0% { transform: scale(1); }
    30% { transform: scale(0.85); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    .chat-header {
      padding: 0.875rem 1rem;
    }

    .header-info h2 {
      font-size: 13px;
    }

    .messages-area {
      padding: 1rem;
      gap: 0.75rem;
    }

    .message-bubble {
      max-width: 85%;
      padding: 0.625rem 0.875rem;
      font-size: 13px;
    }

    .input-area {
      padding: 0.875rem 1rem;
    }

    .input-field {
      padding: 0.625rem 0.875rem;
      font-size: 13px;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .message-group,
    .send-btn.sending,
    .online-dot,
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">NK</div>
      <div class="header-info">
        <h2>Nafis Ikbal</h2>
        <div class="online-indicator">
          <div class="online-dot"></div>
          <p>Active now</p>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Call">☎️</button>
      <button class="icon-btn" title="Video">📹</button>
      <button class="icon-btn" title="More">⋮</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-area" id="messagesArea">
    <div class="message-group">
      <div class="message-bubble other">
        Gta Vi banano jaibo?
      </div>
      <div class="message-time">7:10 PM</div>
    </div>

    <div class="message-group own">
      <div class="message-bubble own">
        Not really But we can try 🌿
      </div>
      <div class="message-time">7:12 PM</div>
    </div>

    <div class="message-group">
      <div class="message-bubble other">
        We can make GTA vice city for sure 🌿
      </div>
      <div class="message-time">7:15 PM</div>
    </div>

    <div class="message-group own">
      <div class="message-bubble own">
        Oita jabe
      </div>
      <div class="message-time">7:18 PM</div>
    </div>

    <div id="typingIndicator" style="display: none;">
      <div class="message-group">
        <div class="message-bubble other" style="padding: 0.5rem 0.75rem;">
          <span style="display: inline-flex; gap: 4px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: typing 1.4s infinite; animation-delay: 0s;"></span>
            <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: typing 1.4s infinite; animation-delay: 0.2s;"></span>
            <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: typing 1.4s infinite; animation-delay: 0.4s;"></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-actions">
        <button class="icon-btn">📎</button>
        <button class="icon-btn">😊</button>
      </div>
      <input
        type="text"
        class="input-field"
        placeholder="Message..."
        id="messageInput"
      />
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<style>
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }
</style>

<script>
  const messagesArea = document.getElementById('messagesArea');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const typingIndicator = document.getElementById('typingIndicator');

  function scrollToBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function addMessage(text, isOwn = true) {
    const group = document.createElement('div');
    group.className = `message-group ${isOwn ? 'own' : ''}`;

    const bubble = document.createElement('div');
    bubble.className = `message-bubble ${isOwn ? 'own' : 'other'}`;
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'message-time';
    const now = new Date();
    time.textContent = now.toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit',
    });

    group.appendChild(bubble);
    group.appendChild(time);
    messagesArea.insertBefore(group, typingIndicator);
    scrollToBottom();
  }

  sendBtn.addEventListener('click', () => {
    const text = messageInput.value.trim();
    if (!text) return;

    sendBtn.classList.add('sending');
    addMessage(text, true);
    messageInput.value = '';
    messageInput.focus();

    setTimeout(() => {
      sendBtn.classList.remove('sending');
      typingIndicator.style.display = 'block';
      scrollToBottom();

      setTimeout(() => {
        typingIndicator.style.display = 'none';
        addMessage('That sounds great! 🚀', false);
      }, 2000);
    }, 400);
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  messageInput.addEventListener('input', () => {
    sendBtn.disabled = !messageInput.value.trim();
  });

  scrollToBottom();
</script>
